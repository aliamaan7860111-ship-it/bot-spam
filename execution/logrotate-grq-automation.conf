# Log rotation for the automation bots.
#
# Install as /etc/logrotate.d/grq-automation (root-owned, mode 0644):
#   sudo cp execution/logrotate-grq-automation.conf /etc/logrotate.d/grq-automation
#   sudo chown root:root /etc/logrotate.d/grq-automation
#   sudo chmod 0644 /etc/logrotate.d/grq-automation
#   sudo logrotate -d /etc/logrotate.d/grq-automation   # dry run
#   sudo logrotate -f /etc/logrotate.d/grq-automation   # rotate now
#
# Nothing rotated these before, so they only ever grew: 1.5 GB across three
# files, of which bot_whatsapp.log alone was 898 MB - mostly one now-fixed
# bug writing the same phone-normalisation error tens of thousands of
# times. Disk was at 57%, so this was not yet a problem; it was going to
# be one quietly.
#
# copytruncate is the important part. systemd opens these with
# `StandardOutput=append:` and holds the handle for the life of the
# process, so renaming the file would leave every bot writing to an inode
# nobody can read any more - the logs would look like they had stopped.
# Copy-then-truncate keeps the handle valid. The cost is a sliver of a
# second where a line can be lost, which for these logs is nothing.
#
# maxsize matters as much as daily: a bot stuck in a loop can produce
# hundreds of megabytes between midnights, and that is exactly how the
# 898 MB happened.

/home/bilal/automation/*.log
/home/bilal/automation/.tmp/*.log
{
    daily
    rotate 7
    maxsize 100M
    missingok
    notifempty
    compress
    copytruncate
    nocreate
    su root root
}
